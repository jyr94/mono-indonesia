name: monopoli_indonesia
description: "Monopoli Indonesia - Digital Monopoly game with Indonesian theme"
publish_to: 'none'
version: 1.0.2+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game Engine
  flame: ^1.18.0
  flame_audio: ^2.11.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  web_socket_channel: ^3.0.1

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_database: ^11.3.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1

  # Ads
  google_mobile_ads: ^9.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.16
  audioplayers: ^6.7.1
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/landmarks_real/
    - assets/audio/
    - assets/fonts/
