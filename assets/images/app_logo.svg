<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <!-- Dice -->
  <rect x="160" y="140" width="80" height="80" rx="14" fill="white" opacity="0.95"/>
  <rect x="270" y="140" width="80" height="80" rx="14" fill="white" opacity="0.95"/>
  <!-- Dice 1 dots -->
  <circle cx="200" cy="180" r="8" fill="#212121"/>
  <!-- Dice 6 dots -->
  <circle cx="295" cy="160" r="6" fill="#212121"/>
  <circle cx="325" cy="160" r="6" fill="#212121"/>
  <circle cx="295" cy="180" r="6" fill="#212121"/>
  <circle cx="325" cy="180" r="6" fill="#212121"/>
  <circle cx="295" cy="200" r="6" fill="#212121"/>
  <circle cx="325" cy="200" r="6" fill="#212121"/>
  <!-- Building silhouette -->
  <rect x="170" y="250" width="40" height="80" rx="4" fill="url(#gold)" opacity="0.9"/>
  <rect x="220" y="230" width="50" height="100" rx="4" fill="url(#gold)" opacity="0.95"/>
  <rect x="280" y="260" width="35" height="70" rx="4" fill="url(#gold)" opacity="0.85"/>
  <rect x="325" y="245" width="45" height="85" rx="4" fill="url(#gold)" opacity="0.9"/>
  <!-- Windows -->
  <rect x="232" y="242" width="10" height="10" rx="2" fill="#C62828" opacity="0.6"/>
  <rect x="248" y="242" width="10" height="10" rx="2" fill="#C62828" opacity="0.6"/>
  <rect x="232" y="260" width="10" height="10" rx="2" fill="#C62828" opacity="0.6"/>
  <rect x="248" y="260" width="10" height="10" rx="2" fill="#C62828" opacity="0.6"/>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="bold" fill="url(#gold)" letter-spacing="4">MONOPOLI</text>
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" letter-spacing="8">INDONESIA</text>
</svg>
