  <!-- Ground -->
  <rect x="30" y="98" width="140" height="4" rx="2" fill="#81C784"/>
  <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#C62828">Jakarta</text>
</svg>
