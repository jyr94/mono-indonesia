<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Monas Jakarta -->
  <rect width="200" height="120" rx="8" fill="#FCE4EC"/>
  <!-- Base -->
  <rect x="55" y="85" width="90" height="15" rx="4" fill="#E0E0E0"/>
  <!-- Body -->
  <rect x="85" y="30" width="30" height="55" rx="2" fill="#E0E0E0"/>
  <!-- Flame -->
  <ellipse cx="100" cy="25" rx="14" ry="12" fill="#FFB300"/>
  <ellipse cx="100" cy="23" rx="10" ry="9" fill="#FFD54F"/>
  <!-- Details -->
