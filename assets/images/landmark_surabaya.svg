<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Jembatan Suramadu -->
  <rect width="200" height="120" rx="8" fill="#E3F2FD"/>
  <!-- Water -->
  <rect x="0" y="75" width="200" height="30" rx="0" fill="#64B5F6" opacity="0.4"/>
  <!-- Bridge -->
  <rect x="10" y="55" width="180" height="12" rx="3" fill="#757575"/>
  <!-- Cable towers -->
  <rect x="60" y="25" width="8" height="42" fill="#616161"/>
  <rect x="132" y="25" width="8" height="42" fill="#616161"/>
  <!-- Cables -->
  <line x1="64" y1="25" x2="30" y2="55" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="64" y1="25" x2="100" y2="55" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="136" y1="25" x2="100" y2="55" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="136" y1="25" x2="170" y2="55" stroke="#9E9E9E" stroke-width="1.5"/>
  <!-- Pillars -->
  <rect x="35" y="67" width="6" height="20" fill="#9E9E9E"/>
  <rect x="85" y="67" width="6" height="20" fill="#9E9E9E"/>
  <rect x="155" y="67" width="6" height="20" fill="#9E9E9E"/>
  <text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#0D47A1">Surabaya</text>
</svg>
